trigger:
- main

variables:
  pythonVersion: '3.12'
  ENABLE_DEPLOY: 'false'
  POC08_LOCATION: 'eastus'

stages:
- stage: Validate
  displayName: Validate Python and Bicep
  jobs:
  - job: PythonAndBicep
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip pipx
        pipx install poetry
        poetry check
        poetry install
        poetry run ruff check .
        poetry run pytest
      displayName: Validate Python and run tests

    - script: |
        az bicep install
        az bicep version
        az bicep build --file infra/bicep/main.bicep
        az bicep build-params --file infra/bicep/main.bicepparam
      displayName: Compile Bicep and parameter file

- stage: Deploy
  displayName: Explicit Bicep deployment
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['ENABLE_DEPLOY'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: BicepDeploy
    environment: poc08-lab
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'POC08-SERVICE-CONNECTION'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export POC08_LOCATION="$(POC08_LOCATION)"
                DEPLOYMENT_NAME="poc08-cicd-$(Build.BuildId)"

                az deployment sub validate \
                  --location "$POC08_LOCATION" \
                  --parameters infra/bicep/main.bicepparam \
                  --no-prompt true \
                  --name "$DEPLOYMENT_NAME-validate"

                az deployment sub create \
                  --location "$POC08_LOCATION" \
                  --parameters infra/bicep/main.bicepparam \
                  --no-prompt true \
                  --name "$DEPLOYMENT_NAME"
            displayName: Deploy Bicep only when ENABLE_DEPLOY=true
