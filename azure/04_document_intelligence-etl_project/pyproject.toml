[tool.poetry]
name = "04-document-intelligence-etl-project"
version = "0.1.0"
description = "POC-04 Azure Document Intelligence ETL Project"
authors = ["POC Learner <learner@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
azure-ai-documentintelligence = "1.0.2"
azure-core = ">=1.30.0"
azure-identity = ">=1.17.0"
azure-storage-blob = ">=12.22.0"
azure-functions = ">=1.21.0"
python-dotenv = ">=1.0.1"
jsonschema = ">=4.23.0"
mssql-python = "*"
reportlab = ">=4.2.0"
pytest = ">=8.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
